# Keybind for vim like leader key unbind C-b set -g prefix C-Space
unbind C-b
set -g prefix C-Space
set -g mode-keys vi
set -g mouse on
bind-key g new-window -n lazygit -c "#{pane_current_path}" "lazygit"
set-option -g status-position top

# Keybind for reloading the config file
unbind r
bind r source-file ~/.tmux.conf \; display "🔧 Reloaded ~/.tmux.conf"
bind p display-popup -w 25% -h 25% "calcurse -d today"
bind b run-shell "~/.scripts/backups/tbackup"
bind t display-popup -d "#{pane_current_path}" -w 50% -h 50% -E $SHELL


# v and h are not binded by default, but we never know in the next versions...
unbind v
unbind h
unbind f
unbind l

unbind % # Split vertically
unbind '"' # Split horizontally

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# search sessions
bind C-e display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session |\
    xargs tmux switch-client -t"

# search windows in current session
bind C-f display-popup -E "\
    tmux list-windows -F '#{window_index} #{window_name}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-window |\
    cut -d ' ' -f 1 |\
    xargs tmux select-window -t"


# Terminal vim overrides
set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

set -g default-terminal "tmux-256color"
set-option -g focus-events on
set-option -sg escape-time 10

 #### COLOUR (Solarized dark)

# default statusbar colors
set-option -g status-style fg=yellow,bg=default
# default window title colors
set -g status-left ""
set -g status-right "#[fg=blue,bright]#S"
set -g window-status-format "●"
set -g window-status-current-format "●"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta,nobold}"
set -g window-status-bell-style "fg=red,nobold"
set-window-option -g window-status-style fg=brightblue,bg=default

# pane border
set-option -g pane-border-style fg=black,bg=default #base02
set-option -g pane-active-border-style fg=brightgreen,bg=default #base01

# message text
set-option -g message-style fg=brightred,bg=black #orange and base01

# pane number display
set-option -g display-panes-active-colour blue #blue
set-option -g display-panes-colour brightred #orange

# clock
set-window-option -g clock-mode-colour green #green

# bell
set-window-option -g window-status-bell-style fg=black,bg=red #base02, red
set -g window-style bg=default
set -g window-active-style bg=default
set-option -g status-style bg=default
